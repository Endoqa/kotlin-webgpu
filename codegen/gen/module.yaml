product: jvm/app



repositories:
  - https://maven.endoqa.io


dependencies:
  - io.endoqa:libtree_sitter:0.0.7
  - io.endoqa:tree-sitter:0.0.7
  - ../webidl-nodes
  - com.squareup:kotlinpoet:2.1.0
  - ../schema
  - com.fleeksoft.ksoup:ksoup:0.2.2
  - co.touchlab:stately-concurrent-collections:2.0.0


apply:
  - ../../common.module-template.yaml

settings:
  jvm:
    mainClass: wgpu.gen.MainKt
    release: 22
  kotlin:
    serialization:
      format: json
      enabled: true
    freeCompilerArgs:
      - -Xsuppress-warning=CONTEXT_RECEIVERS_DEPRECATED
